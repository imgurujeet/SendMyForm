<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Achaia Client Demo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap" rel="stylesheet">
    <style>
        body { background: #000; color: #fff; font-family: "Inter", sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .node { width: 400px; padding: 60px; border-radius: 40px; background: #0a0a0a; border: 1px solid rgba(255,255,255,0.05); text-align: center; box-shadow: 0 40px 100px -20px rgba(0,0,0,0.5); }
        h1 { font-size: 24px; font-weight: 900; letter-spacing: -0.05em; text-transform: uppercase; font-style: italic; margin-bottom: 40px; }
        span { color: #7c3aed; }
        input { width: 100%; background: #000; border: 1px solid rgba(255,255,255,0.05); padding: 18px 24px; border-radius: 20px; color: #fff; font-size: 14px; margin-bottom: 16px; outline: none; box-sizing: border-box; }
        input:focus { border-color: #7c3aed; }
        button { width: 100%; background: #fff; color: #000; border: none; padding: 18px; border-radius: 20px; font-weight: 900; font-size: 12px; text-transform: uppercase; cursor: pointer; transition: all 0.3s; margin-top: 20px; }
        button:hover { background: #7c3aed; color: #fff; }
        .label { font-size: 10px; font-weight: 900; color: #444; text-transform: uppercase; letter-spacing: 0.3em; margin-bottom: 30px; display: block; }
    </style>
</head>
<body>
    <div class="node">
        <div class="label">Client Integration Node</div>
        <h1>Contact <span>Us</span></h1>
        
        <form action="http://localhost:3002/api/f/test-achaia" method="POST">
            <input type="text" name="FullName" placeholder="Your Name" required>
            <input type="email" name="Email" placeholder="Your Email Address" required>
            <input type="text" name="Company" placeholder="Company Name">
            <textarea name="Message" placeholder="How can we help?" style="width: 100%; height: 100px; background: #000; border: 1px solid rgba(255,255,255,0.05); padding: 18px 24px; border-radius: 20px; color: #fff; font-size: 14px; outline: none; box-sizing: border-box;"></textarea>
            <button type="submit">Send Ingestion Request</button>
        </form>
        
        <p style="font-size: 8px; color: #222; margin-top: 40px; letter-spacing: 0.5em;">POWERED_BY_EASYFORM_V2</p>
    </div>
</body>
</html>
